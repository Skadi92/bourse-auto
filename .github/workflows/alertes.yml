name: Alertes bourse

on:
  schedule:
    # Du lundi au vendredi à 22 h 30 UTC, après la clôture d'Euronext et de New York.
    # GitHub peut retarder un déclenchement planifié de plusieurs dizaines de minutes.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      commande:
        description: "Commande à exécuter"
        type: choice
        options: [analyser, backtest]
        default: analyser
      essai:
        description: "Mode essai (analyser : n'envoie pas le mail, ne modifie pas l'état)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alertes-bourse
  cancel-in-progress: false

jobs:
  alertes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Analyse et alertes
        if: github.event_name == 'schedule' || inputs.commande == 'analyser'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m bourse analyser ${{ inputs.essai && '--essai' || '' }}

      - name: Backtest
        if: inputs.commande == 'backtest'
        run: python -m bourse backtest

      - name: Sauvegarde de l'état
        if: github.event_name == 'schedule' || (inputs.commande == 'analyser' && !inputs.essai)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/etat.json
          git diff --cached --quiet || git commit -m "État des alertes du $(date -u +%F)"
          git push
