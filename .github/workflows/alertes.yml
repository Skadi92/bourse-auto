name: Alertes bourse

on:
  schedule:
    # Les crons GitHub sont en UTC. Objectif : 22 h 40 heure de Paris, du lundi au vendredi,
    # après la clôture de New York (22 h à Paris). Deux créneaux couvrent l'heure d'été
    # (20 h 40 UTC) et l'heure d'hiver (21 h 40 UTC) ; le job « creneau » ne laisse passer
    # que celui de la saison en cours. La minute 40 évite les pics de charge du début
    # d'heure et de la demi-heure, pendant lesquels GitHub retarde les déclenchements.
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      commande:
        description: "Commande à exécuter"
        type: choice
        options: [analyser, backtest, test-mail]
        default: analyser
      essai:
        description: "Mode essai (analyser : n'envoie pas le mail, ne modifie pas l'état)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alertes-bourse
  cancel-in-progress: false

jobs:
  creneau:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.verif.outputs.lancer }}
    steps:
      - name: Choix du créneau selon l'heure d'été ou d'hiver à Paris
        id: verif
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # +0200 en heure d'été, +0100 en heure d'hiver.
          if [ "$(TZ=Europe/Paris date +%z)" = "+0200" ]; then attendu="40 20 * * 1-5"; else attendu="40 21 * * 1-5"; fi
          if [ "${{ github.event.schedule }}" = "$attendu" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          else
            echo "lancer=false" >> "$GITHUB_OUTPUT"
            echo "Créneau de l'autre saison (${{ github.event.schedule }}), exécution ignorée."
          fi
          echo "Heure de Paris : $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"

  alertes:
    needs: creneau
    if: needs.creneau.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Analyse et alertes
        if: github.event_name == 'schedule' || inputs.commande == 'analyser'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m bourse analyser ${{ inputs.essai && '--essai' || '' }}

      - name: Backtest
        if: inputs.commande == 'backtest'
        run: python -m bourse backtest

      - name: Mail de test
        if: inputs.commande == 'test-mail'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m bourse test-mail

      - name: Sauvegarde de l'état
        if: github.event_name == 'schedule' || (inputs.commande == 'analyser' && !inputs.essai)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/etat.json
          git diff --cached --quiet || git commit -m "État des alertes du $(TZ=Europe/Paris date +%F)"
          git push
