# Configuration de l'outil d'alertes Bourse-auto.
# Les tickers suivent la nomenclature Yahoo Finance (suffixe .PA pour Euronext Paris).
# Composition du CAC 40 vérifiée en octobre 2026 (dernière modification le 22 décembre 2025 :
# entrée d'Eiffage, sortie d'Edenred). Elle est revue chaque trimestre par Euronext.
# toujours = true : l'instrument figure dans chaque mail envoyé, même sans signal.
# ArcelorMittal est suivi sur Amsterdam (MT.AS) : la ligne Paris n'est plus alimentée sur Yahoo.

[[instruments]]
ticker = "^FCHI"
nom = "Indice CAC 40"

