[donnees]
# Historique chargé pour l'analyse quotidienne (marge de chauffe des indicateurs lents incluse).
periode_analyse = "3y"
# Historique chargé pour le backtest.
periode_backtest = "20y"

# Indicateurs courts : description de l'état du jour et graphique.
[indicateurs]
macd_rapide = 12
macd_lente = 26
macd_signal = 9
bollinger_periode = 20
bollinger_ecarts = 2.0
sar_pas = 0.02
sar_max = 0.2
momentum_periode = 10
adx_periode = 14
rsi_periode = 14
# Moyennes mobiles tracées sur le graphique (sans effet sur les signaux).
mm_graphique = [20, 50]

[regles]
adx_tendance = 25
adx_range = 20
score_tendance = 3
score_retournement = 2
fenetre_retournement = 10
quantile_compression = 0.3
fenetre_compression = 120

# Indicateurs lents : régime de fond, seuls à déclencher les alertes ACHAT / VENTE.
[fond]
mm_periode = 200
momentum_periode = 63
# Équivalent journalier d'un MACD 12/26/9 hebdomadaire.
macd_rapide = 60
macd_lente = 130
macd_signal = 45
sar_pas = 0.005
sar_max = 0.05
volatilite_periode = 63

[regles_fond]
# Nombre de séances consécutives pendant lesquelles les conditions doivent tenir.
confirmation_jours = 3
# Momentum trois mois minimal (%) pour un signal d'achat.
momentum_achat_min = 0.0
# Marge (%) sous la moyenne longue pour une vente de tendance.
marge_vente = 2.0
# Vente de krach : repli depuis le plus haut trois mois supérieur à k fois la volatilité trois mois.
krach_k = 1.5
# Séances minimales entre une vente et un nouvel achat.
delai_apres_vente = 10

[backtest]
# Montant de chaque ordre d'achat, en euros. La vente porte sur la valeur atteinte par la ligne.
montant_ordre = 2000

# Barème Bourse Direct, compte-titres et PEA, applicable depuis le 6 janvier 2026.
# paliers = [montant maximal inclus en €, frais fixe en €] ; au-delà, % de la totalité de l'ordre.
[frais]
# Taxe sur les transactions financières, à l'achat des titres marqués ttf = true.
ttf_pct = 0.4

[frais.euronext]
paliers = [[500, 0.99], [1000, 1.90], [2000, 2.90], [4400, 3.80]]
au_dela_pct = 0.09

[frais.us]
paliers = [[10000, 8.50]]
au_dela_pct = 0.09
# Commission de change Bourse Direct, à chaque opération (achat et vente).
change_pct = 0.08

[alertes]
# Nombre maximal d'instruments détaillés dans un mail, classés par force du signal.
max_par_mail = 5
# Force minimale (0 à 100) d'un signal d'ACHAT pour être envoyé. Les VENTES sont toujours
# envoyées, pour ne jamais manquer la sortie d'une position. 0 = tous les achats (règles backtestées).
force_min_achat = 0
objet_prefixe = "[Bourse-auto]"
